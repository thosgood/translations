project:
  type: website
  output-dir: _output

# Nice things to have
repo-url: https://github.com/thosgood/translations
favicon: "_quarto/favicon.ico"

# Page structure
toc: true
number-sections: true

# Citations
nocite: '@*'
link-citations: true
csl: _quarto/maths-translations.csl
reference-section-title: "Bibliography"

# Filters
filters:
  - _quarto/callouts.lua
  - _quarto/tikz.lua

# Formats
format:
  html:
    ## Template content
    include-before-body: _quarto/translators-note.html
    template-partials:
      - _quarto/title-block.html
    ## General
    html-math-method: katex
    embed-resources: true
    date-format: "YYYY"
    lang: en-GB
    css:
      - _quarto/environments.css
    ## ToC and links
    code-links:
      - text: Source files
        href: https://github.com/thosgood/translations
        icon: github
    other-links:
      - text: More translations
        href: https://thosgood.net/translations
        icon: collection
    ## Visual things
    title-block-banner: true
    theme:
      light: [flatly, _quarto/custom.scss]
      dark: [darkly, _quarto/custom.scss]
    callout-appearance: simple
  pdf:
    template: _quarto/template.tex
    pdf-engine: latexmk
    cite-method: biblatex
    biblatexoptions: [backend=biber]
    date-format: "YYYY"
    keep-tex: true
