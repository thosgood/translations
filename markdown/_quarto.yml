project:
  type: website
  output-dir: _output

website:
  page-footer: "[thosgood.net/translations](https://thosgood.net/translations) ![](/_quarto/favicon.ico)"
  favicon: "_quarto/favicon.ico"
  # GitHub links in table of contents #
  repo-url: https://github.com/thosgood/translations
  repo-subdir: markdown
  repo-actions: ["source", "issue"]


# Page structure #
toc: true
toc-title: "Table of contents"
number-sections: true

# Citations #
nocite: '@*'
link-citations: true
csl: _quarto/maths-translations.csl
reference-section-title: "Bibliography"

# Filters #
filters:
  - _quarto/callouts.lua
  - _quarto/tikz.lua

# Formats #
format:
  html:
    ## Template content ##
    include-before-body: _quarto/translators-note.html
    template-partials:
      - _quarto/title-block.html
    ## General ##
    html-math-method: katex
    # Embedding resources makes the files a bit bigger but means that we can just move them around on the server
    embed-resources: true
    date-format: "YYYY"
    lang: en-GB
    css:
      - _quarto/environments.css
      - _quarto/CrimsonPro/fonts.css
      - _quarto/InriaSerif/fonts.css
    ## ToC and links ##
    # other-links:
    #   - text: More translations
    #     href: https://thosgood.net/translations
    #     icon: collection
    ## Visual things ##
    title-block-banner: true
    theme:
      light: [flatly, _quarto/custom.scss]
      dark: [darkly, _quarto/custom.scss]
    callout-appearance: simple
  pdf:
    template: _quarto/template.tex
    pdf-engine: latexmk
    cite-method: biblatex
    biblatexoptions: [backend=biber]
    date-format: "YYYY"
    keep-tex: true
